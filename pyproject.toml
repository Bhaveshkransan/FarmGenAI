[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "farmgenai"
version = "2.1.0"
description = "FarmGenAI / AgriNegotiator — Multi-Agent Procurement and Autonomous Negotiation System"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.104.1",
    "sqlalchemy>=2.0.23",
    "aiosqlite>=0.20.0",
    "pydantic>=2.7.4",
    "pydantic-settings>=2.4.0",
    "langgraph>=0.2.60",
    "langchain>=0.3.14",
    "langchain-core>=0.3.29",
    "httpx>=0.27.0",
    "passlib>=1.7.4",
    "python-jose>=3.3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
